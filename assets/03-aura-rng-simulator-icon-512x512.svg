<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#7B2CBF" />
      <stop offset="55%" stop-color="#3C096C" />
      <stop offset="100%" stop-color="#080014" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#FF6600" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" />

  <!-- Sunburst Rays -->
  <g opacity="0.22" stroke="#FFFFFF" stroke-width="18">
    <line x1="256" y1="256" x2="0" y2="0" />
    <line x1="256" y1="256" x2="256" y2="0" />
    <line x1="256" y1="256" x2="512" y2="0" />
    <line x1="256" y1="256" x2="512" y2="256" />
    <line x1="256" y1="256" x2="512" y2="512" />
    <line x1="256" y1="256" x2="256" y2="512" />
    <line x1="256" y1="256" x2="0" y2="512" />
    <line x1="256" y1="256" x2="0" y2="256" />
  </g>

  <!-- Outer Neon Border -->
  <rect x="14" y="14" width="484" height="484" rx="38" fill="none" stroke="#FFD700" stroke-width="10" />
  <rect x="24" y="24" width="464" height="464" rx="30" fill="none" stroke="#00FFFF" stroke-width="4" opacity="0.8" />

  <!-- Top Viral CTR Badge -->
  <rect x="46" y="34" width="420" height="64" rx="18" fill="url(#badgeGrad)" filter="url(#glow)" stroke="#FFFFFF" stroke-width="3" />
  <text x="256" y="77" font-family="Impact, Arial Black, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">1 IN 10,000,000?!</text>

  <!-- Central Emblem Glow Circle -->
  <circle cx="256" cy="240" r="115" fill="#00FFFF" opacity="0.18" />
  <circle cx="256" cy="240" r="92" fill="none" stroke="#FFD700" stroke-width="6" stroke-dasharray="18,10" />

  <!-- Main Game Title -->
  <text x="256" y="225" font-family="Impact, Arial Black, sans-serif" font-size="76" font-weight="900" fill="url(#goldGrad)" stroke="#000000" stroke-width="4" text-anchor="middle" filter="url(#glow)">DIVINE</text>
  <text x="256" y="298" font-family="Impact, Arial Black, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" stroke="#000000" stroke-width="3" text-anchor="middle" filter="url(#glow)">AURA RNG</text>

  <!-- Subtitle Pill -->
  <rect x="38" y="335" width="436" height="48" rx="12" fill="#000000" opacity="0.65" stroke="#00FFFF" stroke-width="2" />
  <text x="256" y="366" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#00FFFF" text-anchor="middle">ROLL 1 IN 10,000,000 • AFK SHRINE • 30 AURAS</text>

  <!-- Bottom Promo Code Ribbon -->
  <rect x="56" y="408" width="400" height="62" rx="16" fill="#FFD700" filter="url(#glow)" stroke="#000000" stroke-width="4" />
  <text x="256" y="449" font-family="Impact, Arial Black, sans-serif" font-size="32" font-weight="900" fill="#000000" text-anchor="middle">CODE: LUCKYAURA</text>
</svg>
